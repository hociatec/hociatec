name: Backend quality

on:
  push:
    paths:
      - 'src/**'
      - 'config/**'
      - 'migrations/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'tools/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'migrations/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'tools/**'
      - '.github/workflows/backend-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Static quality checks
        run: composer quality
