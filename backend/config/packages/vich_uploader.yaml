vich_uploader:
    db_driver: orm
    form: false
    twig: false
    storage: file_system
    mappings:
        product_images:
            uri_prefix: '/uploads/products'
            upload_destination: '%kernel.project_dir%/public/uploads/products'
            namer:
                service: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: true
            delete_on_update: true
            delete_on_remove: true
        service_images:
            uri_prefix: '/uploads/services'
            upload_destination: '%kernel.project_dir%/public/uploads/services'
            namer:
                service: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: true
            delete_on_update: true
            delete_on_remove: true
