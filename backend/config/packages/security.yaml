security:
    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_APPOINTMENTS_MANAGER
            - ROLE_AUDITS_MANAGER
            - ROLE_BETA_MANAGER
            - ROLE_BACKUP_MANAGER
            - ROLE_CATALOG_MANAGER
            - ROLE_CUSTOMERS_MANAGER
            - ROLE_LOYALTY_MANAGER
            - ROLE_MARKETING_MANAGER
            - ROLE_NEWS_MANAGER
            - ROLE_OPERATIONS
            - ROLE_ORDERS_MANAGER
            - ROLE_PAYMENTS_MANAGER
            - ROLE_PROMOTIONS_MANAGER
            - ROLE_QUOTES_MANAGER
            - ROLE_TRADE_INS_MANAGER
            - ROLE_TRAINING_MANAGER
            - ROLE_VOUCHERS_MANAGER
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            id: App\Module\Auth\Infrastructure\Security\EmailUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_login:
            pattern: ^/api/auth/login(?:/|$)
            stateless: true
            provider: app_user_provider
            user_checker: App\Module\Auth\Infrastructure\Security\UserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: App\Module\Auth\Infrastructure\Security\AuthenticationSuccessHandler
                failure_handler: App\Module\Auth\Infrastructure\Security\AuthenticationFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api_public_auth:
            pattern: ^/api/(?:csrf-token|auth/(?:register|verify|password-reset|refresh|logout))(?:/|$)
            security: false

        api:
            pattern: ^/api(?:/|$)
            stateless: true
            provider: app_user_provider
            user_checker: App\Module\Auth\Infrastructure\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/health(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/csrf-token(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook(?:/|$), roles: PUBLIC_ACCESS }
        # Nginx restricts this endpoint to local monitoring clients.
        - { path: ^/metrics(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/me(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/password-reset(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/activation(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/public(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/backups(?:/|$), roles: ROLE_BACKUP_MANAGER }
        - { path: ^/api/admin/operations(?:/|$), roles: ROLE_OPERATIONS }
        - { path: ^/api/admin/marketing(?:/|$), roles: ROLE_MARKETING_MANAGER }
        - { path: ^/api/admin/catalog(?:/|$), roles: ROLE_CATALOG_MANAGER }
        - { path: ^/api/admin/appointments(?:/|$), roles: ROLE_APPOINTMENTS_MANAGER }
        - { path: ^/api/admin/audits(?:/|$), roles: ROLE_AUDITS_MANAGER }
        - { path: ^/api/admin/beta-(?:testers|reports|campaigns)(?:/|$), roles: ROLE_BETA_MANAGER }
        - { path: ^/api/admin/customers(?:/|$), roles: ROLE_CUSTOMERS_MANAGER }
        - { path: ^/api/admin/loyalty(?:/|$), roles: ROLE_LOYALTY_MANAGER }
        - { path: ^/api/admin/news(?:/|$), roles: ROLE_NEWS_MANAGER }
        - { path: ^/api/admin/orders(?:/|$), roles: ROLE_ORDERS_MANAGER }
        - { path: ^/api/admin/payments(?:/|$), roles: ROLE_PAYMENTS_MANAGER }
        - { path: ^/api/admin/promotions(?:/|$), roles: ROLE_PROMOTIONS_MANAGER }
        - { path: ^/api/admin/quotes(?:/|$), roles: ROLE_QUOTES_MANAGER }
        - { path: ^/api/admin/services(?:/|$), roles: ROLE_QUOTES_MANAGER }
        - { path: ^/api/admin/trade-ins(?:/|$), roles: ROLE_TRADE_INS_MANAGER }
        - { path: ^/api/admin/training(?:s|-categories|-sessions|-enrollments)(?:/|$), roles: ROLE_TRAINING_MANAGER }
        - { path: ^/api/admin/vouchers(?:/|$), roles: ROLE_VOUCHERS_MANAGER }
        - { path: ^/api/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/api(?:/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
