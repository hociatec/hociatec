# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(STRIPE_WEBHOOK_SECRET): ''
    env(STRIPE_REFUND_WEBHOOK_SECRET): ''
    env(WEASYPRINT_PYTHON): ''
    env(WEASYPRINT_PYTHONPATH): ''
    env(WEASYPRINT_HOME): ''
    env(STRIPE_SECRET_KEY): ''
    env(BACKUP_ENCRYPTION_KEY_FILE): '/etc/hociatec/backup.key'
    env(METRICS_TOKEN): ''
    env(OUTBOX_ALERT_WEBHOOK_URL): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Module\Outbox\Application\OutboxEventHandler:
            tags: ['app.outbox_handler']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'

    App\Infrastructure\Http\RequestIdProcessor:
        tags: ['monolog.processor']

    App\Module\Auth\Infrastructure\Http\AuthCookieService:
        arguments:
            $environment: '%kernel.environment%'

    App\Module\Auth\UI\Controller\ActivationRedirectController:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Auth\Application\Service\PasswordResetService:
        arguments:
            $outbox: '@App\Module\Outbox\Application\Outbox'

    App\Module\Auth\Application\Service\PasswordResetEmailService:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Infrastructure\Http\CsrfTokenService:
        arguments:
            $environment: '%kernel.environment%'

    App\Infrastructure\Http\ApiErrorSanitizerSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    App\Module\Outbox\Application\OutboxEventStore:
        alias: App\Module\Outbox\Infrastructure\Repository\OutboxEventRepository

    App\Module\Marketing\Application\Port\MarketingAudienceQuery:
        alias: App\Module\Marketing\Infrastructure\Repository\DoctrineMarketingAudienceQuery

    App\Module\Marketing\Application\Port\MarketingRecipientContextQuery:
        alias: App\Module\Marketing\Infrastructure\Repository\DoctrineMarketingRecipientContextQuery

    App\Module\Outbox\Application\OutboxAlertNotifier:
        alias: App\Module\Outbox\Infrastructure\Alert\WebhookOutboxAlertNotifier

    App\Module\Outbox\Infrastructure\Alert\WebhookOutboxAlertNotifier:
        arguments:
            $webhookUrl: '%env(OUTBOX_ALERT_WEBHOOK_URL)%'

    App\Module\TradeIn\Application\Port\TradeInReceiptRenderer:
        alias: App\Module\TradeIn\Infrastructure\Pdf\TradeInReceiptPdfRenderer

    App\Module\Order\Application\Port\OrderInvoicePdfRenderer:
        alias: App\Module\Order\Infrastructure\Pdf\OrderInvoicePdfService

    App\Module\Quote\Application\Port\QuotePdfRenderer:
        alias: App\Module\Quote\Infrastructure\Pdf\QuotePdfService

    App\Module\Audit\Application\Port\AuditPdfRenderer:
        alias: App\Module\Audit\Infrastructure\Pdf\AuditPdfService

    App\Shared\Application\TransactionManager:
        alias: App\Shared\Infrastructure\Doctrine\DoctrineTransactionManager

    App\Infrastructure\Http\RateLimitSubscriber:
        arguments:
            $limiters: !service_locator
                public_api: '@limiter.public_api'
                checkout: '@limiter.checkout'
                contact_public: '@limiter.contact_public'
                product_share_public: '@limiter.product_share_public'
                beta_signup: '@limiter.beta_signup'
                beta_report_create: '@limiter.beta_report_create'
                beta_report_comment: '@limiter.beta_report_comment'

    App\Module\Admin\Application\Backup\Service\MaintenanceModeService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\Admin\Application\Backup\Service\BackupStatusProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\Admin\Application\Backup\Service\BackupStateStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\Admin\Application\Backup\Service\BackupFileStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\Admin\Application\Backup\Service\DatabaseBackupDumper:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Module\System\UI\Controller\MetricsController:
        arguments:
            $metricsToken: '%env(METRICS_TOKEN)%'

    App\Module\TradeIn\Application\Service\TradeInPrivateFileStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\Admin\Application\Backup\Service\BackupEncryptionService:
        arguments:
            $keyFile: '%env(BACKUP_ENCRYPTION_KEY_FILE)%'

    App\Module\Order\Infrastructure\Command\SecureInvoiceStorageCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Module\User\Application\Service\AccountActivationEmailService:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Contact\Application\Service\ContactNotificationSender:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'
            $contactRecipient: '%env(CONTACT_RECIPIENT)%'

    App\Module\Contact\Application\Service\ContactAcknowledgementSender:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\TradeIn\Application\Service\TradeInNotificationEmailService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Catalog\Application\Service\ProductShareEmailService:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Training\Application\Service\TrainingEnrollmentCheckoutService:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Voucher\Application\Service\VoucherNotificationEmailService:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\User\Application\Service\AdminCustomerEmailService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Notification\Application\Service\UserCommunicationNotifier:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Notification\Application\Service\AccountNotificationProvider:
        arguments:
            $computedProviders:
                - '@App\Module\Notification\Application\Service\PendingReviewNotificationProvider'
                - '@App\Module\Notification\Application\Service\AppointmentNotificationProvider'
                - '@App\Module\Notification\Application\Service\TrainingNotificationProvider'
                - '@App\Module\Notification\Application\Service\AuditNotificationProvider'
                - '@App\Module\Notification\Application\Service\VoucherNotificationProvider'

    App\Module\Order\Application\Service\StripeApiClient:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Module\Order\Application\Service\CartHostedCheckoutCreator:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Order\Application\Service\OrderHostedCheckoutCreator:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Order\Application\Service\OrderNotificationEmailService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Order\Application\Service\OrderNotificationContentProvider:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Quote\Application\Service\QuoteCreatedEmailContentProvider:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Quote\Application\Service\QuoteEmailDeliveryService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\Order\Application\Service\StripeWebhookVerifier:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            $refundWebhookSecret: '%env(STRIPE_REFUND_WEBHOOK_SECRET)%'

    App\Module\Marketing\Application\Service\MarketingRecipientContextProvider:
        arguments:
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    App\Module\Marketing\Application\Service\MarketingCampaignSender:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Infrastructure\Pdf\AccessiblePdfRenderer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $configuredPython: '%env(WEASYPRINT_PYTHON)%'
            $configuredPythonPath: '%env(WEASYPRINT_PYTHONPATH)%'
            $configuredHome: '%env(WEASYPRINT_HOME)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
