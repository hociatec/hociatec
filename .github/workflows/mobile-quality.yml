name: Mobile quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iphone/**'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches: [main, master]
    paths:
      - 'iphone/**'
      - '.github/workflows/mobile-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iphone

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget tests
        run: flutter test

  ios-build:
    runs-on: macos-latest
    needs: quality
    defaults:
      run:
        working-directory: iphone

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Verify iOS simulator build
        run: flutter build ios --debug --simulator

      - name: Verify unsigned iOS device build
        run: flutter build ios --release --no-codesign

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA for AltStore
        run: |
          rm -rf build/ios/ipa-export
          mkdir -p build/ios/ipa-export/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa-export/Payload/
          cd build/ios/ipa-export
          ditto -c -k --sequesterRsrc --keepParent Payload hociatec-mobile-unsigned-altstore.ipa

      - name: List iOS build outputs
        run: |
          find build/ios -maxdepth 4 -type f | sort

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: hociatec-ios-unsigned-ipa
          path: iphone/build/ios/ipa-export/hociatec-mobile-unsigned-altstore.ipa
          if-no-files-found: error

      - name: Upload unsigned archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: hociatec-ios-unsigned-archive
          path: iphone/build/ios/archive/Runner.xcarchive
          if-no-files-found: error
