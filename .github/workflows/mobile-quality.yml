name: Mobile quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iphone/**'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches: [main, master]
    paths:
      - 'iphone/**'
      - '.github/workflows/mobile-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iphone

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget tests
        run: flutter test

  ios-build:
    runs-on: macos-latest
    needs: quality
    env:
      IPA_BASENAME: hociatec-altstore
    defaults:
      run:
        working-directory: iphone

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version metadata
        id: app_meta
        run: |
          APP_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)"
          APP_BUILD="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f2)"
          IPA_FILENAME="${IPA_BASENAME}-v${APP_VERSION}-b${APP_BUILD}.ipa"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_build=${APP_BUILD}" >> "$GITHUB_OUTPUT"
          echo "ipa_filename=${IPA_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Verify iOS simulator build
        run: flutter build ios --debug --simulator

      - name: Verify unsigned iOS device build
        run: flutter build ios --release --no-codesign

      - name: Package clean unsigned IPA for AltStore
        run: |
          rm -rf build/ios/ipa-export
          mkdir -p build/ios/ipa-export/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa-export/Payload/
          find build/ios/ipa-export/Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} +
          find build/ios/ipa-export/Payload -name 'embedded.mobileprovision' -type f -delete
          find build/ios/ipa-export/Payload -name 'SC_Info' -type d -prune -exec rm -rf {} +
          cd build/ios/ipa-export
          ditto -c -k --sequesterRsrc --keepParent Payload "${{ steps.app_meta.outputs.ipa_filename }}"

      - name: Validate AltStore IPA structure
        run: ./tools/validate_altstore_ipa.sh "build/ios/ipa-export/${{ steps.app_meta.outputs.ipa_filename }}"

      - name: List iOS build outputs
        run: |
          find build/ios -maxdepth 4 -type f | sort

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: hociatec-ios-unsigned-ipa-v${{ steps.app_meta.outputs.app_version }}-b${{ steps.app_meta.outputs.app_build }}
          path: iphone/build/ios/ipa-export/${{ steps.app_meta.outputs.ipa_filename }}
          if-no-files-found: error

      - name: Upload unsigned archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: hociatec-ios-unsigned-archive
          path: iphone/build/ios/archive/Runner.xcarchive
          if-no-files-found: error
