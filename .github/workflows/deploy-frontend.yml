name: Deploy frontend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate deploy secrets
        env:
          FRONTEND_DEPLOY_HOST: ${{ secrets.FRONTEND_DEPLOY_HOST }}
          FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
          FRONTEND_DEPLOY_PORT: ${{ secrets.FRONTEND_DEPLOY_PORT }}
          FRONTEND_DEPLOY_SSH_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
          FRONTEND_DEPLOY_USER: ${{ secrets.FRONTEND_DEPLOY_USER }}
        run: |
          test -n "$FRONTEND_DEPLOY_HOST" || { echo "Missing secret FRONTEND_DEPLOY_HOST"; exit 1; }
          test -n "$FRONTEND_DEPLOY_PATH" || { echo "Missing secret FRONTEND_DEPLOY_PATH"; exit 1; }
          test -n "$FRONTEND_DEPLOY_PORT" || { echo "Missing secret FRONTEND_DEPLOY_PORT"; exit 1; }
          test -n "$FRONTEND_DEPLOY_SSH_KEY" || { echo "Missing secret FRONTEND_DEPLOY_SSH_KEY"; exit 1; }
          test -n "$FRONTEND_DEPLOY_USER" || { echo "Missing secret FRONTEND_DEPLOY_USER"; exit 1; }

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}

      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.FRONTEND_DEPLOY_PORT }}" "${{ secrets.FRONTEND_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend/dist to production
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.FRONTEND_DEPLOY_PORT }}" \
            frontend/dist/ \
            "${{ secrets.FRONTEND_DEPLOY_USER }}@${{ secrets.FRONTEND_DEPLOY_HOST }}:${{ secrets.FRONTEND_DEPLOY_PATH }}/"
