name: Publish iOS download

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Mobile quality run ID to publish
        required: false
  workflow_run:
    workflows:
      - Mobile quality
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  publish-ipa:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: ios-publish-latest
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Read native iOS app metadata
        id: ios_meta
        run: |
          PROJECT_FILE="app_iphone/hociatec iphone.xcodeproj/project.pbxproj"
          BUNDLE_IDENTIFIER="$(sed -nE 's/.*PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;.*/\1/p' "${PROJECT_FILE}" | head -n 1)"
          MIN_OS_VERSION="$(sed -nE 's/.*IPHONEOS_DEPLOYMENT_TARGET = ([^;]+);/\1/p' "${PROJECT_FILE}" | head -n 1)"

          if [ -z "${BUNDLE_IDENTIFIER}" ] || [ -z "${MIN_OS_VERSION}" ]; then
            echo "Impossible de lire les metadonnees iOS depuis ${PROJECT_FILE}." >&2
            exit 1
          fi

          echo "bundle_identifier=${BUNDLE_IDENTIFIER}" >> "$GITHUB_OUTPUT"
          echo "min_os_version=${MIN_OS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve IPA artifact name
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT_NAME="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("hociatec-ios-unsigned-ipa-v"))) | .name' | head -n 1)"

          if [ -z "${ARTIFACT_NAME}" ]; then
            echo "Impossible de trouver l'artefact IPA pour le run ${RUN_ID}." >&2
            exit 1
          fi

          echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf tmp-ios-download
          mkdir -p tmp-ios-download
          gh run download "${{ inputs.run_id || github.event.workflow_run.id }}" --name "${{ steps.artifact.outputs.name }}" --dir tmp-ios-download

      - name: Generate AltStore source JSON
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          IPA_PATH="$(find tmp-ios-download -maxdepth 2 -name '*.ipa' | head -n 1)"

          if [ -z "${IPA_PATH}" ]; then
            echo "Impossible de trouver le fichier IPA telecharge." >&2
            exit 1
          fi

          APP_VERSION="$(printf '%s' "${ARTIFACT_NAME}" | sed -E 's/^hociatec-ios-unsigned-ipa-v([^ -]+)-b([0-9]+)$/\1/')"
          APP_BUILD="$(printf '%s' "${ARTIFACT_NAME}" | sed -E 's/^hociatec-ios-unsigned-ipa-v([^ -]+)-b([0-9]+)$/\2/')"
          VERSION_RELEASE_TAG="ios-v${APP_VERSION}-b${APP_BUILD}"
          PUBLIC_IPA_FILENAME="hociatec-altstore-v${APP_VERSION}-b${APP_BUILD}.ipa"
          IPA_SIZE="$(wc -c < "${IPA_PATH}" | tr -d '[:space:]')"
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IPA_URL="https://github.com/hociatec/hociatec-downloads/releases/download/${VERSION_RELEASE_TAG}/${PUBLIC_IPA_FILENAME}"
          SOURCE_URL="https://github.com/hociatec/hociatec-downloads/releases/download/ios-latest/hociatec-altstore-source.json"
          ICON_URL="https://hociatec.fr/logo.png"

          cat > tmp-ios-download/hociatec-altstore-source.json <<EOF
          {
            "name": "Hociatec",
            "subtitle": "Application mobile officielle Hociatec",
            "description": "Source AltStore officielle de l'application mobile Hociatec.",
            "iconURL": "${ICON_URL}",
            "website": "https://hociatec.fr",
            "tintColor": "#16324F",
            "featuredApps": [
              "${{ steps.ios_meta.outputs.bundle_identifier }}"
            ],
            "apps": [
              {
                "name": "Hociatec",
                "bundleIdentifier": "${{ steps.ios_meta.outputs.bundle_identifier }}",
                "developerName": "Hociatec",
                "subtitle": "Catalogue, prestations et services Hociatec",
                "localizedDescription": "Application mobile officielle Hociatec. Retrouvez les services, le catalogue et les mises a jour depuis AltStore.",
                "iconURL": "${ICON_URL}",
                "tintColor": "#16324F",
                "category": "business",
                "versions": [
                  {
                    "version": "${APP_VERSION}",
                    "buildVersion": "${APP_BUILD}",
                    "date": "${RELEASE_DATE}",
                    "localizedDescription": "Derniere version publiee automatiquement depuis la CI Hociatec.",
                    "downloadURL": "${IPA_URL}",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "${{ steps.ios_meta.outputs.min_os_version }}"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF

      - name: Publish versioned IPA to public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          TARGET_REPOSITORY: hociatec/hociatec-downloads
        run: |
          ARTIFACT_NAME="${{ steps.artifact.outputs.name }}"
          IPA_PATH="$(find tmp-ios-download -maxdepth 2 -name '*.ipa' | head -n 1)"
          APP_VERSION="$(printf '%s' "${ARTIFACT_NAME}" | sed -E 's/^hociatec-ios-unsigned-ipa-v([^ -]+)-b([0-9]+)$/\1/')"
          APP_BUILD="$(printf '%s' "${ARTIFACT_NAME}" | sed -E 's/^hociatec-ios-unsigned-ipa-v([^ -]+)-b([0-9]+)$/\2/')"
          RELEASE_TAG="ios-v${APP_VERSION}-b${APP_BUILD}"
          RELEASE_TITLE="iOS ${APP_VERSION} (${APP_BUILD})"
          RELEASE_NOTES="Build iOS non signe pour AltStore, publie automatiquement."
          PUBLIC_IPA_FILENAME="hociatec-altstore-v${APP_VERSION}-b${APP_BUILD}.ipa"

          if [ -z "${IPA_PATH}" ]; then
            echo "Impossible de trouver le fichier IPA telecharge." >&2
            exit 1
          fi

          PUBLIC_IPA_PATH="tmp-ios-download/${PUBLIC_IPA_FILENAME}"

          if [ "${IPA_PATH}" != "${PUBLIC_IPA_PATH}" ]; then
            cp "${IPA_PATH}" "${PUBLIC_IPA_PATH}"
          fi

          if ! gh release view "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}"
          fi

          gh release upload "${RELEASE_TAG}" "${PUBLIC_IPA_PATH}" --repo "${TARGET_REPOSITORY}" --clobber

      - name: Publish stable AltStore latest assets
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          TARGET_REPOSITORY: hociatec/hociatec-downloads
        run: |
          RELEASE_TAG="ios-latest"
          RELEASE_TITLE="iOS latest"
          RELEASE_NOTES="Assets AltStore officiels pointant vers le dernier build iOS publie."
          SOURCE_PATH="tmp-ios-download/hociatec-altstore-source.json"
          LATEST_IPA_PATH="$(find tmp-ios-download -maxdepth 2 -name '*.ipa' | head -n 1)"

          if [ ! -f "${SOURCE_PATH}" ]; then
            echo "Impossible de trouver le fichier source AltStore genere." >&2
            exit 1
          fi

          if [ -z "${LATEST_IPA_PATH}" ]; then
            echo "Impossible de trouver le fichier IPA a publier dans ios-latest." >&2
            exit 1
          fi

          cp "${LATEST_IPA_PATH}" tmp-ios-download/hociatec-altstore-latest.ipa

          if gh release view "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete-asset "${RELEASE_TAG}" hociatec-altstore-source.json --repo "${TARGET_REPOSITORY}" --yes >/dev/null 2>&1 || true
            gh release delete-asset "${RELEASE_TAG}" hociatec-altstore-latest.ipa --repo "${TARGET_REPOSITORY}" --yes >/dev/null 2>&1 || true
          else
            gh release create "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}"
          fi

          gh release upload "${RELEASE_TAG}" "${SOURCE_PATH}" --repo "${TARGET_REPOSITORY}" --clobber
          gh release upload "${RELEASE_TAG}" tmp-ios-download/hociatec-altstore-latest.ipa --repo "${TARGET_REPOSITORY}" --clobber

      - name: Validate published public AltStore assets
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          TARGET_REPOSITORY: hociatec/hociatec-downloads
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          APP_VERSION="$(printf '%s' "${ARTIFACT_NAME}" | sed -E 's/^hociatec-ios-unsigned-ipa-v([^ -]+)-b([0-9]+)$/\1/')"
          APP_BUILD="$(printf '%s' "${ARTIFACT_NAME}" | sed -E 's/^hociatec-ios-unsigned-ipa-v([^ -]+)-b([0-9]+)$/\2/')"
          VERSION_RELEASE_TAG="ios-v${APP_VERSION}-b${APP_BUILD}"
          PUBLIC_IPA_FILENAME="hociatec-altstore-v${APP_VERSION}-b${APP_BUILD}.ipa"
          LATEST_IPA_FILENAME="hociatec-altstore-latest.ipa"
          IPA_URL="https://github.com/hociatec/hociatec-downloads/releases/download/${VERSION_RELEASE_TAG}/${PUBLIC_IPA_FILENAME}"
          LATEST_IPA_URL="https://github.com/hociatec/hociatec-downloads/releases/download/ios-latest/${LATEST_IPA_FILENAME}"
          SOURCE_URL="https://github.com/hociatec/hociatec-downloads/releases/download/ios-latest/hociatec-altstore-source.json"

          rm -rf tmp-ios-published
          mkdir -p tmp-ios-published

          for attempt in 1 2 3 4 5; do
            echo "Verification de la propagation GitHub Release, tentative ${attempt}/5"

            if curl -fsSL "${IPA_URL}" -o "tmp-ios-published/${PUBLIC_IPA_FILENAME}" \
              && curl -fsSL "${LATEST_IPA_URL}" -o "tmp-ios-published/${LATEST_IPA_FILENAME}" \
              && curl -fsSL "${SOURCE_URL}" -o tmp-ios-published/hociatec-altstore-source.json; then
              break
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Les assets publics AltStore ne sont pas encore disponibles apres 5 tentatives." >&2
              exit 1
            fi

            sleep 15
          done

          ./app_iphone/tools/validate_altstore_ipa.sh "tmp-ios-published/${PUBLIC_IPA_FILENAME}"
          ./app_iphone/tools/validate_altstore_ipa.sh "tmp-ios-published/${LATEST_IPA_FILENAME}"
          ./app_iphone/tools/validate_altstore_source.sh \
            tmp-ios-published/hociatec-altstore-source.json \
            "${APP_VERSION}" \
            "${APP_BUILD}"
