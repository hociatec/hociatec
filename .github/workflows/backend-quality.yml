name: Backend quality

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: hociatec
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://root:@127.0.0.1:3306/hociatec?serverVersion=8.0.32&charset=utf8mb4
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, curl, dom, iconv, intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: backend-composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: backend-composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php bin/console cache:warmup --env=dev
      - run: php bin/console doctrine:database:create --if-not-exists --no-interaction
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: composer quality
